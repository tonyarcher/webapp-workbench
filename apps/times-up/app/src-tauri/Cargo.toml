[package]
name = "times-up"
version = "0.1.0"
description = "Times Up reader"
authors = ["tonyarcher"]
edition = "2021"

[lib]
name = "times_up_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "times-up"
path = "src/main.rs"
