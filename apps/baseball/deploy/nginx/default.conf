# Reverse-proxy gateway for the Baseball deployment.
# - `/` serves a hello-world page from the hello volume.
# - `/baseball/` proxies to the `baseball` service, stripping the prefix.
# - `/stock-game/`, `/lemmy-vertical-scroll/`, and `/rss-reader/` are
#   PLACEHOLDERS for future services. Their default hostnames match the route
#   names and use port 3000. They are runtime-resolved via Docker DNS
#   (resolver + variable proxy_pass) so the gateway starts even before those
#   services are defined; requests return 502 until the services exist.
#   To enable one, add a matching service to docker-compose.yml (see
#   deploy/README.md) — no gateway config changes are required.

# Map the Upgrade header to a connection value: send "upgrade" when the client
# requests it, otherwise close the connection. Used to pass WebSocket upgrades
# through to the proxy locations below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hello-world page at the gateway root
    location = / {
        root /usr/share/nginx/hello;
        try_files /index.html =404;
    }

    # Redirect `/baseball` to the trailing-slash form
    location = /baseball {
        return 301 /baseball/;
    }

    # Baseball SPA (prefix stripped). Resolved at runtime via Docker DNS so the
    # gateway survives baseball container recreation without a reload.
    location /baseball/ {
        set $upstream_baseball http://baseball:80;
        rewrite ^/baseball/(.*)$ /$1 break;
        proxy_pass $upstream_baseball;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- PLACEHOLDER: future Docker services (hostname:3000) ---
    location /stock-game/ {
        set $upstream_stock_game http://stock-game:3000;
        rewrite ^/stock-game/(.*)$ /$1 break;
        proxy_pass $upstream_stock_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lemmy-vertical-scroll/ {
        set $upstream_lemmy_vertical_scroll http://lemmy-vertical-scroll:3000;
        rewrite ^/lemmy-vertical-scroll/(.*)$ /$1 break;
        proxy_pass $upstream_lemmy_vertical_scroll;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rss-reader/ {
        set $upstream_rss_reader http://rss-reader:3000;
        rewrite ^/rss-reader/(.*)$ /$1 break;
        proxy_pass $upstream_rss_reader;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
