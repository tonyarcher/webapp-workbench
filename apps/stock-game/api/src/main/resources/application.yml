server:
    port: ${PORT:3005}

spring:
    application:
        name: stock-game-api
    flyway:
        # The database predates Flyway; baseline it instead of wiping pgdata.
        baseline-on-migrate: true
    jackson:
        default-property-inclusion: non_null
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    mvc:
        throw-exception-if-no-handler-found: true
    web:
        resources:
            add-mappings: false

# Off unless SWAGGER_ENABLED is set, so the docs are not published through the
# gateway. Local `gradle bootRun` sets it.
springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: ${SWAGGER_ENABLED:false}
    swagger-ui:
        path: /swagger-ui.html
        enabled: ${SWAGGER_ENABLED:false}

# Actuator: a health check that actually verifies the database, plus metrics.
# The gateway does not route /actuator/**, so these stay internal.
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            show-details: always
            probes:
                enabled: true
    metrics:
        tags:
            application: ${spring.application.name}
