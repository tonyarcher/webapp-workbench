name: Dependency Submission

# Dependabot reads the Gradle manifests, which do not evaluate the per-API
# eachDependency pins. Submit the resolved project graph so its alerts track
# the versions the build actually resolves.

on:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    submit:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '25'
            - uses: gradle/actions/setup-gradle@v6
            - uses: gradle/actions/dependency-submission@v6
