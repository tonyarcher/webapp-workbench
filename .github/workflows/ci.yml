name: CI

# Pinned to ubuntu-24.04 rather than ubuntu-latest. The `latest` label is
# scheduled to move to Ubuntu 26, and an OS change under a green workflow is
# exactly the kind of surprise that should arrive as a commit rather than as a
# surprise. Move to ubuntu-26.04 deliberately, once it has been exercised.

on:
    push:
        branches: [main]
    pull_request:

# Cancels an in-progress run when the same ref is pushed again.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    web:
        name: Web (typecheck and tests)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  # test:scripts runs the Flyway immutability guard, which compares
                  # each migration against every commit that touched it. On the
                  # default shallow checkout every --diff-filter=A resolves to the
                  # boundary commit, so an edit or deletion looks like an addition
                  # and the guard passes without inspecting anything. Its own
                  # test_history_is_complete asserts a shallow clone must fail.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # npm ci installs the Playwright package but not its browser binaries, and
            # @web/test-runner launches real Chromium. Cache the downloaded browsers to
            # avoid re-fetching them on every run; --with-deps still ensures the
            # required system libraries are present.
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium
            # npm test runs the workspace suites and then test:scripts, which is the
            # Flyway migration guard, the doc-rot guard, and the a11y and hygiene
            # checks. Those are Python and do not belong to any one workspace.
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    a11y:
        name: A11y (${{ matrix.name }})
        runs-on: ubuntu-24.04
        strategy:
            # Audits are grouped to avoid repeating npm ci and Playwright setup for
            # every app. Each app still boots its own dev server on its own port,
            # and all apps in a group run even if one fails. Groups run in parallel.
            fail-fast: false
            matrix:
                include:
                    - name: baseball-basketball-football
                      dirs: apps/baseball apps/basketball apps/football
                    - name: calendar-clipstack-lemmy
                      dirs: apps/calendar-sync apps/clipstack apps/lemmy-vertical-scroll
                    - name: radio-coldwater-rss
                      dirs: apps/radio-station apps/coldwater apps/rss/app
                    - name: stock-fitness-user
                      dirs: apps/stock-game/app apps/fitness/app apps/user/app
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # Cache the downloaded browser binaries to avoid re-fetching them on every
            # run; --with-deps still ensures the required system libraries are present.
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium
            # Run from each app's own directory, where `playwright test` finds its
            # config and `npm run dev` serves that app. Run every app in the group
            # so one failure does not hide others.
            - name: Run axe audits
              shell: bash
              run: |
                  failed=0
                  for dir in ${{ matrix.dirs }}; do
                      echo "::group::axe audit $dir"
                      if ! (cd "$dir" && npm run test:e2e); then
                          echo "::error::axe audit failed: $dir"
                          failed=1
                      fi
                      echo "::endgroup::"
                  done
                  exit $failed

    jvm:
        name: JVM (tests, detekt, coverage)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  # Matches the toolchain the API modules compile against.
                  distribution: temurin
                  java-version: '26'
            - uses: gradle/actions/setup-gradle@v6
            # checkAll runs tests, detekt and the Jacoco line and branch gates for all
            # five APIs.
            #
            # -Pintegration is what makes the rate limiter's slice test run. Without
            # it that test is excluded, so `check` needs no Docker daemon and a
            # developer can run it locally; with it, the module starts a throwaway
            # Postgres container and exercises the real
            # `INSERT ... ON CONFLICT ... DO UPDATE ... RETURNING`. That statement
            # is the limiter's whole correctness argument, and no in-process
            # database can run it: H2 2.4.240 rejects the ON CONFLICT conflict
            # target outright.
            #
            # The flag is passed as `-Pintegration=true` rather than bare. A bare
            # `-Pintegration` supplies an empty string, which reads as false, and
            # the job would go green having skipped the one test that matters.
            #
            # So the runner's Docker daemon is required here, deliberately: this is
            # the only place the upsert is checked against Postgres.
            #
            # ./gradlew, so the build uses the Gradle version the wrapper pins
            # rather than whichever Gradle the runner image ships. The wrapper is
            # committed for that reason, and gradlew carries mode 100755 in git so
            # it is executable on checkout.
            - run: ./gradlew checkAll -Pintegration=true --console=plain

    verify:
        name: Verify (formatters and linters)
        # PSScriptAnalyzer runs here rather than in a separate windows-latest job.
        # The ubuntu runner images ship PowerShell 7, so the one strict job below
        # can cover every check verify.py knows about. Splitting PowerShell out
        # would have forced that job to run without --strict, because the Unix-only
        # tools are absent on Windows, and a non-strict job reports success when a
        # check silently never ran.
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  # gitleaks scans the history, not only the working tree, so a
                  # shallow clone would hide a secret that was committed and later
                  # removed. That is the case the scan exists to catch.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: .github/workflows/ci.yml
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '26'

            - name: Install npm tools
              # prettier is only a devDependency, so `npm ci` puts it in
              # node_modules/.bin, which GitHub Actions does not add to PATH.
              # verify.py resolves tools with shutil.which, so prettier would be
              # reported SKIP and --strict would fail the job on every run.
              #
              # Prepending the workspace bin directory fixes that and is preferable
              # to `npm install -g prettier`: it puts the exact version
              # package.json declares on PATH, so the `prettier --check` that gates
              # the build cannot drift from the one the repo is formatted with.
              run: |
                  npm ci
                  echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Install Python tools
              run: python -m pip install --upgrade pip ruff mypy yamllint sqlfluff

            - name: Install shellcheck
              run: |
                  if ! command -v shellcheck >/dev/null 2>&1; then
                      sudo apt-get update
                      sudo apt-get install -y shellcheck
                  fi

            # Downloaded on cache miss and cached; bump the cache key to refresh the
            # resolved tool versions. The downloader still resolves the latest release
            # on a miss (asset-name globs handle upstream renames) so a refresh picks
            # up current binaries without hardcoding asset filenames.
            - name: Cache binary linters
              uses: actions/cache@v4
              id: cache-linters
              with:
                  path: ${{ runner.temp }}/ci-tools
                  key: binary-linters-${{ runner.os }}-v1
            - name: Install binary linters
              if: steps.cache-linters.outputs.cache-hit != 'true'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  TOOL_DIR: ${{ runner.temp }}/ci-tools
              run: |
                  mkdir -p "$TOOL_DIR"
                  python - <<'PY'
                  import fnmatch, gzip, io, json, os, pathlib, sys, tarfile, urllib.request

                  # repo, binary name, asset-name glob. The glob rather than an exact
                  # name because upstream renames them: taplo switched to .gz assets,
                  # and an exact name that worked yesterday 404s today. The binaries go
                  # to TOOL_DIR rather than /usr/local/bin because the runner user
                  # cannot write there without sudo, and a heredoc piped into sudo
                  # would not be worth the quoting.
                  #
                  # Matching is case-insensitive on purpose. The releases API reports
                  # hadolint's asset as "hadolint-linux-x86_64" but the download URL
                  # serves it as "hadolint-Linux-x86_64", so a case-sensitive glob
                  # written from the URL succeeds locally and matches nothing on Linux.
                  # Case folding removes that whole class of mismatch.
                  TOOL_DIR = pathlib.Path(os.environ["TOOL_DIR"])
                  TOOLS = [
                      ("mvdan/sh", "shfmt", "shfmt_*_linux_amd64"),
                      ("pinterest/ktlint", "ktlint", "ktlint"),
                      ("tamasfe/taplo", "taplo", "taplo-linux-x86_64*"),
                      ("hadolint/hadolint", "hadolint", "hadolint-linux-x86_64*"),
                      # verify.py's repo-wide scans. gitleaks ships a tarball rather
                      # than a bare binary; osv-scanner ships a bare binary.
                      ("gitleaks/gitleaks", "gitleaks", "gitleaks_*_linux_x64.tar.gz"),
                      ("google/osv-scanner", "osv-scanner", "osv-scanner_linux_amd64"),
                  ]

                  USER_AGENT = "webapp-workbench-ci"

                  def api_fetch(url):
                      """Authenticated call to api.github.com only.

                      urllib's redirect handler copies every header except
                      content-length and content-type onto the redirected request, so
                      one authenticated helper would forward the token to whichever
                      host the release asset redirects to. Those are pre-signed
                      storage URLs, and S3 rejects a signed URL that also carries
                      Authorization with "Only one auth mechanism allowed".
                      """
                      headers = {"User-Agent": USER_AGENT}
                      token = os.environ.get("GITHUB_TOKEN", "")
                      if token:
                          headers["Authorization"] = f"Bearer {token}"
                      return urllib.request.urlopen(urllib.request.Request(url, headers=headers))

                  def asset_fetch(url):
                      """Unauthenticated download of a public release asset.

                      Release assets are public, so no credential is needed, and the
                      token has no business reaching a storage host.
                      """
                      request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
                      return urllib.request.urlopen(request)

                  # Checksums and signatures are uploaded beside the binary and match
                  # a loose glob, so they are never install candidates.
                  NOT_A_BINARY = (".sha256", ".sha256sum", ".asc", ".sig", ".txt", ".pem", ".sbom")

                  for repo, binary, pattern in TOOLS:
                      release = json.load(api_fetch(f"https://api.github.com/repos/{repo}/releases/latest"))
                      asset = next(
                          (
                              a
                              for a in release["assets"]
                              if not a["name"].endswith(NOT_A_BINARY)
                              and fnmatch.fnmatch(a["name"].lower(), pattern.lower())
                          ),
                          None,
                      )
                      if asset is None:
                          shipped = ", ".join(a["name"] for a in release["assets"])
                          sys.exit(
                              f"{repo} {release['tag_name']} ships no asset matching"
                              f" {pattern}. It has: {shipped}"
                          )
                      blob = asset_fetch(asset["browser_download_url"]).read()
                      if asset["name"].endswith(".tar.gz"):
                          # A tarball, not a bare binary: pull the named member out.
                          # Checked before .gz, which would otherwise decompress the
                          # archive into a tar that cannot be executed.
                          with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as tar:
                              member = next(
                                  (m for m in tar.getmembers() if m.name == binary), None
                              )
                              if member is None:
                                  sys.exit(f"{asset['name']} holds no {binary} member")
                              blob = tar.extractfile(member).read()
                      elif asset["name"].endswith(".gz"):
                          blob = gzip.decompress(blob)
                      destination = TOOL_DIR / binary
                      destination.write_bytes(blob)
                      destination.chmod(0o755)
                      print(f"{repo} {release['tag_name']} -> {destination}")
                  PY
            - name: Add binary linters to PATH
              env:
                  TOOL_DIR: ${{ runner.temp }}/ci-tools
              run: echo "$TOOL_DIR" >> "$GITHUB_PATH"

            # The two .ps1 files under apps/rss/app/scripts make verify.py generate this
            # check, so the module has to be present or --strict turns into a failure.
            - name: Cache PSScriptAnalyzer
              uses: actions/cache@v4
              id: cache-pssa
              with:
                  path: ~/.local/share/powershell/Modules
                  key: pssa-${{ runner.os }}-v1
            - name: Install PSScriptAnalyzer
              if: steps.cache-pssa.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                  Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber

            # Strict on purpose. Without it verify.py prints SKIP and still exits 0 when
            # a tool is missing from PATH, so a broken install step above would show up
            # as a green build that ran none of the linters it claims to enforce. With
            # it, a missing tool fails the job and names itself. A developer running
            # verify.py locally still gets the lenient default.
            - name: Run verify.py
              run: python tools/verify.py --strict
