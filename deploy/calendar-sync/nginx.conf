# nginx config for Calendar Sync. The gateway strips the /calendar-sync/
# prefix before proxying, so this server serves the built app at the root
# path and proxies /api/trakt/ to api.trakt.tv (Trakt has no CORS).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/trakt/ {
        resolver 1.1.1.1 valid=30s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host api.trakt.tv;
        proxy_set_header Authorization $http_authorization;
        rewrite ^/api/trakt/(.*)$ /$1 break;
        proxy_pass https://api.trakt.tv;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
