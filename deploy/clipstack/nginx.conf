# nginx config for Clipstack. The gateway strips the /clipstack/ prefix
# before proxying, so this server serves the built app at the root path.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Never cache the SPA shell so updates propagate immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Service worker must always be revalidated for updates to take effect
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: any path that isn't a real file resolves to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
