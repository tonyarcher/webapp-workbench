# Grafana provisions its datasources from here at boot. Provisioned rather than
# clicked in the UI so a rebuild comes back with the same wiring and nothing
# depends on one person's session.
apiVersion: 1

datasources:
    - name: VictoriaLogs
      # Pinned, not auto-generated. The provisioned dashboards reference this uid
      # in every panel; left implicit, Grafana assigns a fresh one per install and
      # every panel silently resolves to no datasource. Changing it here means
      # regenerating the dashboards, so it is part of that file's contract.
      uid: victorialogs
      type: victoriametrics-logs-datasource
      # The plugin is vendored into this image via GF_INSTALL_PLUGINS rather
      # than fetched at runtime, so a deploy cannot be broken by Grafana.com
      # being unreachable.
      access: proxy
      url: http://victoria-logs:9428
      isDefault: true
      jsonData:
          # Query the stored logs directly; no Loki query layer in between.
          derivedFields: []
      editable: false
