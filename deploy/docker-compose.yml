# Reverse-proxy gateway stack for the Baseball deployment.
#   gateway  - nginx Alpine, port 80; serves `/` (hello) and routes subpaths.
#   baseball - nginx static, serves the Baseball Vite app under /baseball/.
#   rss-reader - nginx static, serves the RSS reader under /rss-reader/.
#   rss-api    - Kotlin JSON API + feed poller for the RSS reader under
#                /rss-reader/api/ (prefix stripped by the gateway).
#   postgres   - shared Postgres instance; each app gets its own database.
#                Data persists in the `pgdata` named volume across rebuilds.
#   stock-game - nginx static, serves the Stock Game Vite SPA under /stock-game/
#                (prefix stripped by the gateway; hash routes).
#   stock-game-api - Kotlin JSON API (Spring Data JPA) for Stock Game under
#                /stock-game/api/ (prefix stripped by the gateway). Postgres database `stock`.
#   lemmy-vertical-scroll - nginx static, serves the Lemmy feed under
#                           /lemmy-vertical-scroll/.
#   clipstack - nginx static, serves Clipstack under /clipstack/.
#   calendar-sync - nginx static + Trakt API proxy, serves Calendar Sync
#                   under /calendar-sync/.
#   radio-station - nginx static, serves Radio Station under /radio-station/.
#   radio-api    - Kotlin JSON API for Radio Station under
#                  /radio-station/api/ (prefix stripped by the gateway).
#   football     - nginx static, serves Football under /football/.
#   basketball   - nginx static, serves Basketball under /basketball/.
#   fitness      - nginx static, serves Fitness under /fitness/.
#   fitness-api  - Kotlin JSON API (Spring Data JPA) for Fitness under /fitness/api/
#                  (prefix stripped by the gateway). Postgres database `fitness`.
#   user-web     - nginx static, accounts landing page under /auth/.
#   user-api     - Kotlin/Spring Boot identity API under /user-api/
#                  (prefix stripped by the gateway). Postgres database `users`.
#   gitea        - Go git server + wiki under /git/ (prefix stripped by the gateway).
#                  Postgres database `gitea`. SSH on the mapped host port (VPN only).
# Each app listens on port 3000 internally; the gateway strips the prefix for
# the static apps.

# Bounded container logs. Without this every service writes an unbounded
# json-file, and a busy day fills the disk that Postgres and every app's data
# share -- which takes the stack down rather than just the logging.
# Top level on purpose: inside `services:` the anchor would nest under the
# service map and every reference below would be a cycle.
x-logging: &bounded-logs
    driver: json-file
    options:
        max-size: '10m'
        max-file: '3'
        # Stamp the container name into every line. Without it a log viewer can
        # only show a container id, which says nothing about which service
        # emitted the line. Alloy lifts it into a `container` label.
        tag: '{{.Name}}'

services:
    gateway:
        logging: *bounded-logs
        build:
            context: .
            dockerfile: gateway/Dockerfile
        ports:
            - '80:80'
            - '443:443'
        depends_on:
            - baseball
            - rss-reader
            - rss-api
            - stock-game
            - stock-game-api
            - lemmy-vertical-scroll
            - clipstack
            - calendar-sync
            - radio-station
            - radio-api
            - football
            - basketball
            - fitness
            - fitness-api
            - user-web
            - user-api
            - gitea
        restart: unless-stopped
        networks:
            - baseball

    postgres:
        logging: *bounded-logs
        # Built from deploy/ so the init scripts bake into the image. Remote
        # daemons cannot use host bind mounts, so COPY (like the gateway).
        build:
            context: .
            dockerfile: postgres/Dockerfile
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-rss}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rss}
            POSTGRES_DB: ${POSTGRES_DB:-rss}
            # Subpath under the data dir so the mount root stays owned by root.
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rss} -d ${POSTGRES_DB:-rss}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - baseball

    rss-api:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/rss-api/Dockerfile
        # Must exceed the 20s graceful shutdown phase in
        # application-prod.yml, or compose SIGKILLs mid-request.
        stop_grace_period: 30s
        environment:
            # application-prod.yml: quiet framework logs, gzip, graceful shutdown.
            SPRING_PROFILES_ACTIVE: prod
            # JsonLog reads this; the app JSON lines are separate from the
            # framework levels the prod profile sets.
            LOG_LEVEL: ${LOG_LEVEL:-info}
            PORT: 3000
            DATABASE_URL: postgres://${POSTGRES_USER:-rss}:${POSTGRES_PASSWORD:-rss}@postgres:5432/${POSTGRES_DB:-rss}
            OAUTH_JWKS_URI: http://user-api:3000/oauth/jwks
            # Defaults derive from PUBLIC_ORIGIN so a deployment sets one public
            # origin and cannot leave a service advertising a stale host. The
            # fallback keeps plain-HTTP localhost working with no .env at all.
            OAUTH_ISSUER: ${OAUTH_ISSUER:-${PUBLIC_ORIGIN:-http://localhost}/user-api}
            # Server AI summarization (optional). Empty AI_PROVIDER disables the
            # /ai backend. Secrets stay in the untracked deploy/.env; compose only
            # passes them through at run, never into the image.
            AI_PROVIDER: ${AI_PROVIDER:-}
            AI_API_URL: ${AI_API_URL:-}
            AI_MODEL: ${AI_MODEL:-}
            AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
            AI_HOURLY_LIMIT: ${AI_HOURLY_LIMIT:-30}
            AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
            AI_API_USER: ${AI_API_USER:-}
            AI_API_PASSWORD: ${AI_API_PASSWORD:-}
            # TypeSafe Jev key for front-page ranking (AI_PROVIDER=jev). Empty by
            # default; the real value stays in the untracked deploy/.env.
            TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - baseball

    baseball:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/baseball/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    rss-reader:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/rss-reader/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    stock-game:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/stock-game/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    stock-game-api:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/stock-game-api/Dockerfile
        # Must exceed the 20s graceful shutdown phase in
        # application-prod.yml, or compose SIGKILLs mid-request.
        stop_grace_period: 30s
        environment:
            # application-prod.yml: quiet framework logs, gzip, graceful shutdown.
            SPRING_PROFILES_ACTIVE: prod
            # JsonLog reads this; the app JSON lines are separate from the
            # framework levels the prod profile sets.
            LOG_LEVEL: ${LOG_LEVEL:-info}
            PORT: 3000
            DATABASE_URL: postgres://${POSTGRES_USER:-rss}:${POSTGRES_PASSWORD:-rss}@postgres:5432/stock
            PRICE_PROVIDER: ${PRICE_PROVIDER:-yahoo}
            OAUTH_JWKS_URI: http://user-api:3000/oauth/jwks
            # Defaults derive from PUBLIC_ORIGIN so a deployment sets one public
            # origin and cannot leave a service advertising a stale host. The
            # fallback keeps plain-HTTP localhost working with no .env at all.
            OAUTH_ISSUER: ${OAUTH_ISSUER:-${PUBLIC_ORIGIN:-http://localhost}/user-api}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - baseball

    lemmy-vertical-scroll:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/lemmy-vertical-scroll/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    clipstack:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/clipstack/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    calendar-sync:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/calendar-sync/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    radio-api:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/radio-api/Dockerfile
        # Must exceed the 20s graceful shutdown phase in
        # application-prod.yml, or compose SIGKILLs mid-request.
        stop_grace_period: 30s
        environment:
            # application-prod.yml: quiet framework logs, gzip, graceful shutdown.
            SPRING_PROFILES_ACTIVE: prod
            # JsonLog reads this; the app JSON lines are separate from the
            # framework levels the prod profile sets.
            LOG_LEVEL: ${LOG_LEVEL:-info}
            PORT: 3000
            DATABASE_URL: postgres://${POSTGRES_USER:-rss}:${POSTGRES_PASSWORD:-rss}@postgres:5432/radio
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - baseball

    radio-station:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/radio-station/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    football:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/football/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    basketball:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/basketball/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    fitness-api:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/fitness-api/Dockerfile
        # Must exceed the 20s graceful shutdown phase in
        # application-prod.yml, or compose SIGKILLs mid-request.
        stop_grace_period: 30s
        environment:
            # application-prod.yml: quiet framework logs, gzip, graceful shutdown.
            SPRING_PROFILES_ACTIVE: prod
            # JsonLog reads this; the app JSON lines are separate from the
            # framework levels the prod profile sets.
            LOG_LEVEL: ${LOG_LEVEL:-info}
            PORT: 3000
            DATABASE_URL: postgres://${POSTGRES_USER:-rss}:${POSTGRES_PASSWORD:-rss}@postgres:5432/fitness
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - baseball

    fitness:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/fitness/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    user-api:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/user-api/Dockerfile
        # Must exceed the 20s graceful shutdown phase in
        # application-prod.yml, or compose SIGKILLs mid-request.
        stop_grace_period: 30s
        environment:
            # application-prod.yml: quiet framework logs, gzip, graceful shutdown.
            SPRING_PROFILES_ACTIVE: prod
            # JsonLog reads this; the app JSON lines are separate from the
            # framework levels the prod profile sets.
            LOG_LEVEL: ${LOG_LEVEL:-info}
            PORT: 3000
            DATABASE_URL: postgres://${POSTGRES_USER:-rss}:${POSTGRES_PASSWORD:-rss}@postgres:5432/users
            SERVICE: user-api
            # Defaults derive from PUBLIC_ORIGIN so a deployment sets one public
            # origin and cannot leave a service advertising a stale host. The
            # fallback keeps plain-HTTP localhost working with no .env at all.
            OAUTH_ISSUER: ${OAUTH_ISSUER:-${PUBLIC_ORIGIN:-http://localhost}/user-api}
            # Two bases, because the OIDC discovery document publishes both.
            # OAUTH_PUBLIC_BASE is followed by a BROWSER to the authorize
            # endpoint, so it carries the gateway prefix. The other endpoints
            # are called by client processes inside the compose network, where
            # the gateway has already stripped that prefix and the public origin
            # is not the way in. Publishing one base for all of them breaks
            # exactly the server-to-server calls.
            OAUTH_PUBLIC_BASE: ${OAUTH_PUBLIC_BASE:-${PUBLIC_ORIGIN:-http://localhost}/user-api}
            OAUTH_INTERNAL_BASE: ${OAUTH_INTERNAL_BASE:-http://user-api:3000}
            # Clients listed here are confidential: they may complete a flow
            # without PKCE, and must then authenticate at the token endpoint.
            # Digests, not secrets, so this is safe to read in a Settings dump.
            OAUTH_CLIENT_SECRETS: ${OAUTH_CLIENT_SECRETS:-}
            WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
            WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost,http://127.0.0.1}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - baseball

    user-web:
        logging: *bounded-logs
        build:
            context: ..
            dockerfile: deploy/user-web/Dockerfile
        restart: unless-stopped
        networks:
            - baseball

    gitea:
        logging: *bounded-logs
        # Pinned upstream forge. 1.27.x is a supported line; do not float to :latest.
        image: gitea/gitea:1.27.3
        environment:
            USER_UID: '1000'
            USER_GID: '1000'
            GITEA__server__HTTP_PORT: '3000'
            GITEA__server__SSH_LISTEN_PORT: '22'
            GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-${PUBLIC_ORIGIN:-http://localhost}/git/}
            GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-localhost}
            GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
            GITEA__database__DB_TYPE: postgres
            GITEA__database__HOST: postgres:5432
            GITEA__database__NAME: gitea
            GITEA__database__USER: ${POSTGRES_USER:-rss}
            GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-rss}
            GITEA__database__SSL_MODE: disable
            # Headless install: env seeds app.ini, Gitea migrates on boot, and the
            # first registered user becomes admin. No web-installer step needed.
            GITEA__security__INSTALL_LOCK: 'true'
            # Gitea refuses to auto-create an account with an empty email, and
            # user-api deliberately issues no email claim: accounts have no
            # address, and inventing one from the username would put a value in
            # front of Gitea that looks deliverable and is not. Skipping the check
            # is the honest way to say this identity is verified by the provider
            # and simply has no address attached.
            GITEA__oauth2_client__SKIP_EMAIL_VERIFY: 'true'
        volumes:
            - gitea-data:/data
        # SSH bypasses the gateway. Bind defaults to localhost; set GITEA_SSH_BIND
        # to the VPN address (e.g. 10.13.13.1) or 0.0.0.0 behind a firewall.
        ports:
            - '${GITEA_SSH_BIND:-127.0.0.1}:${GITEA_SSH_PORT:-2222}:22'
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - baseball

    # Log pipeline. stdout is the contract: apps and the gateway write one JSON
    # object per line, Alloy reads the Docker log files, VictoriaLogs indexes.
    # Grafana reads VictoriaLogs and signs in through user-api like every other
    # surface, so there is no second set of credentials.
    victoria-logs:
        image: victoriametrics/victoria-logs:v1.52.0
        # Pinned, not :latest -- a deploy must not silently change versions.
        command:
            - -storageDataPath=/vlogs
            - -retentionPeriod=${LOG_RETENTION:-30d}
        volumes:
            - victoria-logs-data:/vlogs
        # Not published on the host. Only Grafana and Alloy need to reach it,
        # and an open log-ingest port is an unauthenticated write hole.
        expose:
            - '9428'
        restart: unless-stopped
        logging: *bounded-logs
        networks:
            - baseball

    alloy:
        build:
            context: ..
            dockerfile: deploy/alloy/Dockerfile
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
        volumes:
            # Read-only. Alloy only reads; the Docker socket is not mounted,
            # which is the whole reason this is a bind of the log directory.
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            # Alloy's read positions have to outlive the container. Without this
            # they sit in the writable layer and are lost on every recreate, and
            # tail_from_end then treats a file it has already seen as finished:
            # each deploy would silently drop whatever was logged while Alloy was
            # down, which is exactly the window you most want to read.
            - alloy-data:/var/lib/alloy/data
        restart: unless-stopped
        logging: *bounded-logs
        networks:
            - baseball
        depends_on:
            victoria-logs:
                condition: service_started

    grafana:
        build:
            context: ..
            dockerfile: deploy/grafana/Dockerfile
        environment:
            # Installed at boot rather than clicked into the UI, so a rebuild
            # comes back wired and nothing depends on one session. NOT version
            # pinned: this plugin's releases are not published under the
            # `id:version` tag form that Grafana's installer accepts, so a pin
            # makes the install 404 and the viewer comes up with no datasource.
            # The datasource's JSON plugin id is recorded in the provisioning
            # file instead, which is the part that has to agree.
            GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
            # Sign in with the same identity as every other app. auth_url is
            # fetched by the BROWSER, so it names the public origin;
            # token_url is server-to-server and stays internal.
            GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_SECRET:?set GRAFANA_OAUTH_SECRET in deploy/.env}
            # Deliberately NOT ${OAUTH_ISSUER}: that is the value user-api SIGNS
            # into tokens, which stays origin-independent, and its default is
            # localhost. This URL is fetched by the BROWSER, so it has to be the
            # origin the viewer actually uses. Keep the two separate.
            GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OAUTH_ISSUER:-${OAUTH_PUBLIC_BASE:-${PUBLIC_ORIGIN:-http://localhost}/user-api}}/oauth/authorize
            GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://user-api:3000/oauth/token
            # user-api is PKCE-only, so this is not optional: without it Grafana
            # sends a plain authorization_code request the authorize endpoint
            # rejects.
            GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
            GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: preferred_username
            GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_VALUE: Admin
            # user-api is OAuth2 without an id_token and without /oauth/userinfo,
            # so Grafana reads the claims from the access token, which is a JWT
            # carrying sub and preferred_username. Both paths below must be set
            # or sign-in fails: Grafana requires a login, and it refuses a
            # generic-OAuth user with no email. The username stands in for the
            # email because accounts have no address; revisit if they gain one.
            GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
            GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: preferred_username
            # There is no id_token to validate: user-api returns an access token
            # and a refresh token only. Leaving this on makes Grafana reject the
            # response for want of a token it will never be given.
            GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN: 'false'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
            GF_AUTH_BASIC_ENABLED: 'false'
            GF_SECURITY_ALLOW_EMBEDDING: 'true'
            # Grafana builds its own asset URLs from root_url. Behind the gateway
            # at /logs/ it must be told that prefix or every asset 404s.
            GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-${PUBLIC_ORIGIN:-http://localhost}/logs/}
            GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
        volumes:
            # Provisioning is baked into the image (see deploy/grafana/Dockerfile);
            # only the data dir is a volume, because Grafana must persist state.
            - grafana-data:/var/lib/grafana
        # Reachable only through the gateway at /logs/, like every other app.
        expose:
            - '3000'
        restart: unless-stopped
        logging: *bounded-logs
        networks:
            - baseball
        depends_on:
            victoria-logs:
                condition: service_started

networks:
    baseball:
        driver: bridge

volumes:
    pgdata:
    gitea-data:
    victoria-logs-data:
    grafana-data:
    alloy-data:
