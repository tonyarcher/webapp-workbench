# nginx config for Accounts. The gateway strips the /auth/ prefix
# before proxying, so this server serves the built app at the root path.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-cache";
        # Repeated in every location that sets its own add_header: nginx does not
        # inherit a server-level one. Every call this page makes is same-origin
        # /user-api/ through the gateway, so the policy is strict. style-src
        # allows 'unsafe-inline' for the inline <style> background guard in
        # index.html; the gateway restates this same policy, and two CSP
        # headers intersect, so the copies must not drift apart.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
